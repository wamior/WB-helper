[package]
name = "pvzhelper"
version = "0.2.6"
edition = "2021"

[dependencies]
eframe = "0.29.1"
serde = { version = "1.0", features = ["derive"] }
crossbeam-channel = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
self-replace = "1.5"
serde_json = "1.0"
image = "0.24"
screenshots = "0.8.10"
anyhow = "1.0"
lazy_static = "1.4"
chrono = "0.4"
obfstr = "0.4"


[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_Diagnostics_Debug",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
debug = false
